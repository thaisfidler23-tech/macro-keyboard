# Macro Keyboard Configuration
# This file contains the configuration for the macro keyboard application

version: "1.0.0"

device:
  # Serial port settings
  serialPort: null  # Will be set when a device is connected, or use specific port like "/dev/ttyUSB0"
  baudRate: 9600
  connectionTimeout: 5000
  
  # Hardware configuration
  buttons: 8        # Number of buttons (1-32)
  encoders: 0       # Number of rotary encoders (0-8)

# Logging configuration
logging:
  # Basic settings
  level: "info"               # debug, info, warn, error
  logDir: "logs"              # Log directory (relative to app data directory)
  
  # File rotation settings
  maxFileSize: 5242880        # Maximum log file size in bytes (5MB)
  maxFiles: 10                # Maximum number of log files to retain
  retentionDays: 30           # Days to retain log files
  datePattern: "YYYY-MM-DD"   # Date pattern for log rotation
  
  # Console logging
  enableConsole: true         # Enable console output
  colorizeConsole: true       # Colorize console output
  
  # Remote logging (optional)
  enableRemote: false         # Enable remote log aggregation
  remoteEndpoint: null        # URL for remote log endpoint
  remoteBatchSize: 100        # Number of logs to batch before sending
  remoteFlushInterval: 5000   # Interval to flush remote logs (ms)
  
  # Performance logging
  enablePerformance: true     # Enable performance logging
  performanceThreshold: 100   # Log performance warnings above threshold (ms)
  
  # Structured logging
  enableStructured: false     # Use JSON format for logs
  includeMetadata: true       # Include system metadata in logs

# Security and execution policies
security:
  commandExecution:
    enabled: true           # Allow command-type actions
    mode: "blacklist"       # "allowlist", "blacklist", or "disabled"
    allowedCommands:        # List of allowed commands (when mode is "allowlist")
      - "ls"
      - "echo"
      - "date"
      - "pwd"
      - "whoami"
    blockedCommands:        # List of blocked commands (when mode is "blacklist")
      - "rm"
      - "sudo"
      - "chmod"
      - "passwd"
      - "wget"
      - "curl"
    timeout: 10000          # Command execution timeout in milliseconds
    maxLength: 1000         # Maximum command length in characters

  applicationExecution:
    enabled: true           # Allow application-type actions
    mode: "allowlist"       # "allowlist", "blacklist", or "disabled"
    allowedApplications:    # List of allowed applications (when mode is "allowlist")
      - "Calculator"
      - "TextEdit"
      - "Safari"
      - "Chrome"
      - "Firefox"
      - "Spotify"
      - "iTunes"
      - "Music"
      - "Photos"
      - "Preview"
    blockedApplications:    # List of blocked applications (when mode is "blacklist")
      - "Terminal"
      - "Activity Monitor"
      - "System Preferences"
      - "Disk Utility"
      - "Console"
    maxPathLength: 500      # Maximum application path length

  keypressValidation:
    enabled: true           # Enable keypress validation
    maxKeyCombinations: 5   # Maximum number of keys in a combination
    blockedKeys:            # List of blocked key combinations
      - "alt+f4"
      - "cmd+q"
      - "ctrl+alt+delete"

# Automatic update configuration
updates:
  enabled: true             # Enable automatic update checking
  checkInterval: 86400000   # Check interval in milliseconds (24 hours)
  autoDownload: true        # Automatically download updates when available
  autoInstallOnAppQuit: true # Install updates when app quits
  allowPrerelease: false    # Include pre-release versions
  notify: true              # Show update notifications to user
  silent: false             # Silent update mode (no user interaction)

# Profile management
profiles:
  active: "default"         # Currently active profile
  available: ["default"]    # List of available profiles

# Button configurations
# Each button can have a description, type, and action
buttons:
  button1:
    description: "Volume Up"
    type: "keypress"
    action: "VolumeUp"
    enabled: true
  
  button2:
    description: "Volume Down"
    type: "keypress"
    action: "VolumeDown"
    enabled: true
  
  button3:
    description: "Mute"
    type: "keypress"
    action: "AudioMute"
    enabled: true
  
  button4:
    description: "Calculator"
    type: "application"
    action: "calc"
    enabled: true
  
  button5:
    description: "Screenshot"
    type: "keypress"
    action: "cmd+shift+3"  # macOS screenshot shortcut
    enabled: true
  
  button6:
    description: "Open Terminal"
    type: "application"
    action: "Terminal"
    enabled: true
  
  button7:
    description: "Lock Screen"
    type: "keypress"
    action: "cmd+ctrl+q"  # macOS lock screen
    enabled: true
  
  button8:
    description: "Custom Command"
    type: "command"
    action: "echo 'Button 8 pressed'"
    enabled: true

# Encoder configurations
# Each encoder can have different actions for clockwise and counter-clockwise rotation
encoders:
  # Example encoder configuration (uncomment when device.encoders > 0)
  # encoder1:
  #   description: "Volume Control"
  #   typeCW: "keypress"
  #   actionCW: "VolumeUp"
  #   typeCCW: "keypress"
  #   actionCCW: "VolumeDown"
  #   enabled: true

# Action type definitions:
# - keypress: Send keyboard shortcuts (e.g., "cmd+c", "ctrl+alt+t")
# - command: Execute shell commands (e.g., "open /Applications/Calculator.app")
# - application: Launch applications (e.g., "Calculator", "Terminal")

# Platform-specific examples:
# macOS:
#   - Screenshot: "cmd+shift+3" or "cmd+shift+4"
#   - Lock screen: "cmd+ctrl+q"
#   - Mission Control: "ctrl+up"
#
# Windows:
#   - Screenshot: "win+shift+s"
#   - Lock screen: "win+l"
#   - Task view: "win+tab"
#
# Linux:
#   - Screenshot: "printscreen" or "shift+printscreen"
#   - Lock screen: "ctrl+alt+l"
#   - Activities: "super"