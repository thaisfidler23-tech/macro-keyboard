# Macro Keyboard Configuration
# This file contains the configuration for the macro keyboard application

version: "1.0.0"

device:
  # Serial port settings
  serialPort: null  # Will be set when a device is connected, or use specific port like "/dev/ttyUSB0"
  baudRate: 9600
  connectionTimeout: 5000
  
  # Hardware configuration
  buttons: 8        # Number of buttons (1-32)
  encoders: 0       # Number of rotary encoders (0-8)

# Logging configuration
logging:
  # Basic settings
  level: "info"               # debug, info, warn, error
  logDir: "logs"              # Log directory (relative to app data directory)
  
  # File rotation settings
  maxFileSize: 5242880        # Maximum log file size in bytes (5MB)
  maxFiles: 10                # Maximum number of log files to retain
  retentionDays: 30           # Days to retain log files
  datePattern: "YYYY-MM-DD"   # Date pattern for log rotation
  
  # Console logging
  enableConsole: true         # Enable console output
  colorizeConsole: true       # Colorize console output
  
  # Remote logging (optional)
  enableRemote: false         # Enable remote log aggregation
  remoteEndpoint: null        # URL for remote log endpoint
  remoteBatchSize: 100        # Number of logs to batch before sending
  remoteFlushInterval: 5000   # Interval to flush remote logs (ms)
  
  # Performance logging
  enablePerformance: true     # Enable performance logging
  performanceThreshold: 100   # Log performance warnings above threshold (ms)
  
  # Structured logging
  enableStructured: false     # Use JSON format for logs
  includeMetadata: true       # Include system metadata in logs

# Security and execution policies
security:
  commandExecution:
    enabled: true           # Allow command-type actions
    mode: "blacklist"       # "allowlist", "blacklist", or "disabled"
    allowedCommands:        # List of allowed commands (when mode is "allowlist")
      - "ls"
      - "echo"
      - "date"
      - "pwd"
      - "whoami"
    blockedCommands:        # List of blocked commands (when mode is "blacklist")
      - "rm"
      - "sudo"
      - "chmod"
      - "passwd"
      - "wget"
      - "curl"
    timeout: 10000          # Command execution timeout in milliseconds
    maxLength: 1000         # Maximum command length in characters

  applicationExecution:
    enabled: true           # Allow application-type actions
    mode: "allowlist"       # "allowlist", "blacklist", or "disabled"
    allowedApplications:    # List of allowed applications (when mode is "allowlist")
      - "Calculator"
      - "TextEdit"
      - "Safari"
      - "Chrome"
      - "Firefox"
      - "Spotify"
      - "iTunes"
      - "Music"
      - "Photos"
      - "Preview"
    blockedApplications:    # List of blocked applications (when mode is "blacklist")
      - "Terminal"
      - "Activity Monitor"
      - "System Preferences"
      - "Disk Utility"
      - "Console"
    maxPathLength: 500      # Maximum application path length

  keypressValidation:
    enabled: true           # Enable keypress validation
    maxKeyCombinations: 5   # Maximum number of keys in a combination
    blockedKeys:            # List of blocked key combinations
      - "alt+f4"
      - "cmd+q"
      - "ctrl+alt+delete"

# Automatic update configuration
updates:
  enabled: true             # Enable automatic update checking
  checkInterval: 86400000   # Check interval in milliseconds (24 hours)
  autoDownload: true        # Automatically download updates when available
  autoInstallOnAppQuit: true # Install updates when app quits
  allowPrerelease: false    # Include pre-release versions
  notify: true              # Show update notifications to user
  silent: false             # Silent update mode (no user interaction)

# Performance monitoring configuration
performance:
  enabled: true             # Enable performance monitoring
  updateInterval: 1000      # Metrics collection interval (ms)
  historyLimit: 1000        # Number of historical data points to keep
  enableGC: true            # Monitor garbage collection metrics
  enableOperations: true    # Track operation performance
  enableOptimizations: true # Generate optimization suggestions
  
  # Monitoring thresholds
  thresholds:
    memory: 1073741824      # Memory warning threshold (1GB in bytes)
    eventLoopLag: 100       # Event loop lag warning threshold (ms)
    operationTime: 500      # Operation time warning threshold (ms)
    gcDuration: 50          # GC duration warning threshold (ms)
  
  # Alert configuration
  alerts:
    enabled: true           # Enable performance alerts
    showNotifications: true # Show desktop notifications for critical alerts
    criticalThresholds:
      memory: 2147483648    # Critical memory threshold (2GB in bytes)
      eventLoopLag: 1000    # Critical event loop lag (ms)
      operationTime: 2000   # Critical operation time (ms)
  
  # Data retention and export
  retention:
    enabled: true           # Enable automatic data cleanup
    maxAge: 86400000        # Maximum age of performance data (24 hours in ms)
    cleanupInterval: 3600000 # Cleanup check interval (1 hour in ms)
  
  export:
    includeSystemInfo: true # Include system information in exports
    compressionEnabled: true # Enable compression for exported data

# Plugin system configuration
plugins:
  enabled: true             # Enable plugin system
  pluginsDir: "plugins"     # Plugins directory (relative to app data directory)
  
  # Plugin loading configuration
  autoLoad: true            # Automatically load plugins on startup
  hotReload: true           # Enable hot-reload for development
  watchPlugins: true        # Watch plugin files for changes
  
  # Plugin security and sandboxing
  security:
    sandboxEnabled: true    # Enable VM sandbox for plugin execution
    timeoutMs: 5000         # Plugin operation timeout (ms)
    memoryLimitMB: 100      # Memory limit per plugin (MB)
    allowedModules:         # Node.js modules plugins can require
      - "fs"
      - "path"
      - "crypto"
      - "url"
      - "util"
    
  # Plugin API configuration
  api:
    version: "1.0.0"        # Current plugin API version
    enableLegacy: false     # Support legacy API versions
    rateLimit: 100          # Max API calls per plugin per minute
    
  # Plugin lifecycle configuration
  lifecycle:
    loadTimeoutMs: 10000    # Plugin load timeout (ms)
    unloadTimeoutMs: 5000   # Plugin unload timeout (ms)
    enableDisposalChecks: true # Verify proper resource cleanup
    
  # Plugin communication
  communication:
    enableInterPlugin: true # Allow plugins to communicate with each other
    messageQueueSize: 1000  # Maximum queued messages per plugin
    maxMessageSize: 10240   # Maximum message size in bytes
    
  # Plugin development features
  development:
    enableDevMode: false    # Enable development mode features
    verboseLogging: false   # Enable verbose plugin logging
    enableInspection: false # Enable plugin inspection tools
    reloadOnError: false    # Auto-reload plugins after errors
  
  # Plugin discovery and management
  discovery:
    enableAutoDiscovery: true # Automatically discover new plugins
    scanInterval: 60000     # Directory scan interval (ms)
    supportedFormats:       # Supported plugin formats
      - "js"
      - "json"

# Profile management
profiles:
  active: "default"         # Currently active profile
  available: ["default"]    # List of available profiles

# Button configurations
# Each button can have a description, type, and action
buttons:
  button1:
    description: "Volume Up"
    type: "keypress"
    action: "VolumeUp"
    enabled: true
  
  button2:
    description: "Volume Down"
    type: "keypress"
    action: "VolumeDown"
    enabled: true
  
  button3:
    description: "Mute"
    type: "keypress"
    action: "AudioMute"
    enabled: true
  
  button4:
    description: "Calculator"
    type: "application"
    action: "calc"
    enabled: true
  
  button5:
    description: "Screenshot"
    type: "keypress"
    action: "cmd+shift+3"  # macOS screenshot shortcut
    enabled: true
  
  button6:
    description: "Open Terminal"
    type: "application"
    action: "Terminal"
    enabled: true
  
  button7:
    description: "Lock Screen"
    type: "keypress"
    action: "cmd+ctrl+q"  # macOS lock screen
    enabled: true
  
  button8:
    description: "Custom Command"
    type: "command"
    action: "echo 'Button 8 pressed'"
    enabled: true

# Encoder configurations
# Each encoder can have different actions for clockwise and counter-clockwise rotation
encoders:
  # Example encoder configuration (uncomment when device.encoders > 0)
  # encoder1:
  #   description: "Volume Control"
  #   typeCW: "keypress"
  #   actionCW: "VolumeUp"
  #   typeCCW: "keypress"
  #   actionCCW: "VolumeDown"
  #   enabled: true

# Action type definitions:
# - keypress: Send keyboard shortcuts (e.g., "cmd+c", "ctrl+alt+t")
# - command: Execute shell commands (e.g., "open /Applications/Calculator.app")
# - application: Launch applications (e.g., "Calculator", "Terminal")

# Platform-specific examples:
# macOS:
#   - Screenshot: "cmd+shift+3" or "cmd+shift+4"
#   - Lock screen: "cmd+ctrl+q"
#   - Mission Control: "ctrl+up"
#
# Windows:
#   - Screenshot: "win+shift+s"
#   - Lock screen: "win+l"
#   - Task view: "win+tab"
#
# Linux:
#   - Screenshot: "printscreen" or "shift+printscreen"
#   - Lock screen: "ctrl+alt+l"
#   - Activities: "super"