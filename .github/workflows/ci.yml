name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint
      run: npm run lint
    
    - name: Run tests
      run: npm test
      env:
        CI: true

  build:
    name: Build Application
    needs: lint-and-test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build for Linux
      if: matrix.os == 'ubuntu-latest'
      run: npm run build:linux
    
    - name: Build for Windows
      if: matrix.os == 'windows-latest'
      run: npm run build:win
    
    - name: Build for macOS
      if: matrix.os == 'macos-latest'
      run: npm run build:mac
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}
        path: |
          dist/*.dmg
          dist/*.exe
          dist/*.AppImage
          dist/*.zip
        if-no-files-found: error
        retention-days: 30

  arduino-compile:
    name: Compile Arduino Firmware
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        config: [BUTTONS_8, BUTTONS_12, BUTTONS_16, BUTTONS_24, BUTTONS_32]
        encoder: [0, 2, 4, 8]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v1
    
    - name: Install Arduino core
      run: |
        arduino-cli core update-index
        arduino-cli core install arduino:avr
    
    - name: Create build config
      run: |
        cd arduino/macro-keyboard-firmware
        # Create a temporary file with the matrix configuration
        echo "#define ${{ matrix.config }}" > build_config.h
        echo "#define ENCODER_COUNT ${{ matrix.encoder }}" >> build_config.h
        # Include this in the main config file
        sed -i '1i #include "build_config.h"' config.h
    
    - name: Compile firmware
      run: |
        arduino-cli compile --fqbn arduino:avr:micro arduino/macro-keyboard-firmware/macro-keyboard-firmware.ino --output-dir arduino/build/${{ matrix.config }}_ENC${{ matrix.encoder }}
    
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.config }}-enc${{ matrix.encoder }}
        path: arduino/build/${{ matrix.config }}_ENC${{ matrix.encoder }}/*.hex
        retention-days: 30

  auto-release:
    name: Automatic Release
    needs: [lint-and-test, build, arduino-compile]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Check if release needed
      id: check_release
      run: |
        # Check if the last commit was a version bump (skip ci)
        LAST_COMMIT=$(git log -1 --pretty=%B)
        if echo "$LAST_COMMIT" | grep -i "\[skip ci\]" > /dev/null; then
          echo "Skipping release - last commit was automated version bump"
          echo "should_release=false" >> $GITHUB_OUTPUT
        else
          echo "Release needed - proceeding with version increment"
          echo "should_release=true" >> $GITHUB_OUTPUT
        fi
    
    - name: Configure Git
      if: steps.check_release.outputs.should_release == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
    
    - name: Determine version increment type
      if: steps.check_release.outputs.should_release == 'true'
      id: version_type
      run: |
        # Get the last commit message
        COMMIT_MSG=$(git log -1 --pretty=%B)
        
        # Default to patch version increment
        VERSION_TYPE="patch"
        
        # Check commit message for version increment hints
        if echo "$COMMIT_MSG" | grep -i "\[major\]" > /dev/null; then
          VERSION_TYPE="major"
        elif echo "$COMMIT_MSG" | grep -i "\[minor\]" > /dev/null; then
          VERSION_TYPE="minor"
        elif echo "$COMMIT_MSG" | grep -i "\[patch\]" > /dev/null; then
          VERSION_TYPE="patch"
        fi
        
        echo "version_type=$VERSION_TYPE" >> $GITHUB_OUTPUT
        echo "Detected version increment type: $VERSION_TYPE"
    
    - name: Increment version and create tag
      if: steps.check_release.outputs.should_release == 'true'
      id: version
      run: |
        # Increment version using npm
        NEW_VERSION=$(npm version ${{ steps.version_type.outputs.version_type }} --no-git-tag-version)
        echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
        echo "New version: $NEW_VERSION"
        
        # Commit the version change
        git add package.json package-lock.json
        git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
        
        # Create and push tag
        git tag "$NEW_VERSION"
        git push origin main
        git push origin "$NEW_VERSION"
        
        echo "Created and pushed tag: $NEW_VERSION"