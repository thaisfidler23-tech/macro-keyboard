name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Run ESLint
      run: npm run lint
    
    - name: Run tests
      run: npm test
      env:
        CI: true

  build:
    name: Build Application
    needs: lint-and-test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build for Linux
      if: matrix.os == 'ubuntu-latest'
      run: npm run build:linux
    
    - name: Build for Windows
      if: matrix.os == 'windows-latest'
      run: npm run build:win
    
    - name: Build for macOS
      if: matrix.os == 'macos-latest'
      run: npm run build:mac
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: build-${{ matrix.os }}
        path: |
          dist/*.dmg
          dist/*.exe
          dist/*.AppImage
          dist/*.zip
        if-no-files-found: error
        retention-days: 30

  arduino-compile:
    name: Compile Arduino Firmware
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        config: [BUTTONS_8, BUTTONS_12, BUTTONS_16, BUTTONS_24, BUTTONS_32]
        encoder: [0, 2, 4, 8]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v1
    
    - name: Install Arduino core
      run: |
        arduino-cli core update-index
        arduino-cli core install arduino:avr
    
    - name: Create build config
      run: |
        cd arduino/macro-keyboard-firmware
        # Create a temporary file with the matrix configuration
        echo "#define ${{ matrix.config }}" > build_config.h
        echo "#define ENCODER_COUNT ${{ matrix.encoder }}" >> build_config.h
        # Include this in the main config file
        sed -i '1i #include "build_config.h"' config.h
    
    - name: Compile firmware
      run: |
        arduino-cli compile --fqbn arduino:avr:micro arduino/macro-keyboard-firmware/macro-keyboard-firmware.ino --output-dir arduino/build/${{ matrix.config }}_ENC${{ matrix.encoder }}
    
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-${{ matrix.config }}-enc${{ matrix.encoder }}
        path: arduino/build/${{ matrix.config }}_ENC${{ matrix.encoder }}/*.hex
        retention-days: 30