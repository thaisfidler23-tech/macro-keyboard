name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Generate changelog
      id: changelog
      run: |
        # Get the previous tag
        PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        # Generate changelog from commits between tags
        if [ -n "$PREV_TAG" ]; then
          echo "## Changes" > CHANGELOG.md
          git log $PREV_TAG..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md
        else
          echo "## Changes" > CHANGELOG.md
          echo "- Initial release" >> CHANGELOG.md
        fi
        
        # Set output for release body
        echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
        cat CHANGELOG.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Create Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          --title "Macro Keyboard ${{ github.ref_name }}" \
          --notes '${{ steps.changelog.outputs.CHANGELOG }}

        ## Installation

        ### Desktop Application
        - **Windows**: Download and run the `.exe` installer (NSIS)
        - **macOS**: Choose from two options:
          - `.dmg` file: Download and drag to Applications folder
          - `.pkg` installer: Download and run for system-wide installation *(New in this release!)*
        - **Linux**: Download the `.AppImage` file and make it executable

        ### Arduino Firmware
        Download the appropriate firmware `.hex` file for your button configuration and flash it to your Arduino Micro using the Arduino IDE or avrdude.

        ## Hardware Configuration Files
        Choose the firmware based on your hardware setup:
        - `firmware-BUTTONS_8-enc0.hex`: 8 buttons, no encoders
        - `firmware-BUTTONS_12-enc2.hex`: 12 buttons, 2 encoders  
        - `firmware-BUTTONS_16-enc2.hex`: 16 buttons, 2 encoders
        - `firmware-BUTTONS_24-enc4.hex`: 24 buttons, 4 encoders
        - `firmware-BUTTONS_32-enc8.hex`: 32 buttons, 8 encoders
        - And more combinations available in the release assets

        ---
        
        *All OS-specific packages are automatically built and published with each release.*'

  build-and-upload:
    name: Build and Upload Assets
    needs: create-release
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            asset_name_suffix: linux
          - os: windows-latest  
            asset_name_suffix: windows
          - os: macos-latest
            asset_name_suffix: macos
    
    runs-on: ${{ matrix.os }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build for Linux
      if: matrix.os == 'ubuntu-latest'
      run: npm run build:linux
    
    - name: Build for Windows
      if: matrix.os == 'windows-latest'
      run: npm run build:win
    
    - name: Build for macOS
      if: matrix.os == 'macos-latest'
      run: npm run build:mac
    
    - name: Upload Release Assets (Linux)
      if: matrix.os == 'ubuntu-latest'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # List all generated files for debugging
        echo "Files generated in ./dist:"
        ls -la ./dist/ || echo "No dist directory found"
        
        # Find and upload AppImage file
        APPIMAGE_FILE=$(find ./dist -name "*.AppImage" -type f | head -1)
        if [ -n "$APPIMAGE_FILE" ]; then
          gh release upload "${{ github.ref_name }}" "$APPIMAGE_FILE#MacroKeyboard-${{ github.ref_name }}-linux.AppImage"
          echo "✅ Successfully uploaded Linux AppImage: $APPIMAGE_FILE"
        else
          echo "❌ No AppImage file found in ./dist directory"
          echo "Available files:"
          find ./dist -type f -name "*" 2>/dev/null || echo "No files found"
          exit 1
        fi
    
    - name: Upload Release Assets (Windows)
      if: matrix.os == 'windows-latest'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # List all generated files for debugging
        Write-Host "Files generated in ./dist:"
        Get-ChildItem -Path "./dist" -ErrorAction SilentlyContinue | Format-Table Name, Length
        
        # Find and upload exe installer file
        $INSTALLER_FILE = Get-ChildItem -Path "./dist" -Name "*.exe" -File | Select-Object -First 1
        if ($INSTALLER_FILE) {
          gh release upload "${{ github.ref_name }}" "./dist/$INSTALLER_FILE#MacroKeyboard-${{ github.ref_name }}-windows.exe"
          Write-Host "✅ Successfully uploaded Windows installer: ./dist/$INSTALLER_FILE"
        } else {
          Write-Host "❌ No exe installer file found in ./dist directory"
          Write-Host "Available files:"
          Get-ChildItem -Path "./dist" -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.Name }
          exit 1
        }
      shell: pwsh
    
    - name: Upload Release Assets (macOS)
      if: matrix.os == 'macos-latest'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # List all generated files for debugging
        echo "Files generated in ./dist:"
        ls -la ./dist/ || echo "No dist directory found"
        
        # Track upload success
        UPLOAD_SUCCESS=false
        
        # Find and upload dmg file
        DMG_FILE=$(find ./dist -name "*.dmg" -type f | head -1)
        if [ -n "$DMG_FILE" ]; then
          gh release upload "${{ github.ref_name }}" "$DMG_FILE#MacroKeyboard-${{ github.ref_name }}-macos.dmg"
          echo "✅ Successfully uploaded macOS DMG: $DMG_FILE"
          UPLOAD_SUCCESS=true
        else
          echo "⚠️  No DMG file found"
        fi
        
        # Find and upload pkg file  
        PKG_FILE=$(find ./dist -name "*.pkg" -type f | head -1)
        if [ -n "$PKG_FILE" ]; then
          gh release upload "${{ github.ref_name }}" "$PKG_FILE#MacroKeyboard-${{ github.ref_name }}-macos.pkg"
          echo "✅ Successfully uploaded macOS PKG: $PKG_FILE"
          UPLOAD_SUCCESS=true
        else
          echo "⚠️  No PKG file found"
        fi
        
        # Ensure at least one macOS package was found and uploaded
        if [ "$UPLOAD_SUCCESS" = false ]; then
          echo "❌ No macOS installer files found (.dmg or .pkg)"
          echo "Available files:"
          find ./dist -type f -name "*" 2>/dev/null || echo "No files found"
          exit 1
        fi
        
        echo "✅ macOS packages successfully published to release"

  build-firmware:
    name: Build and Upload Firmware
    needs: create-release
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        config: [BUTTONS_8, BUTTONS_12, BUTTONS_16, BUTTONS_24, BUTTONS_32]
        encoder: [0, 2, 4, 8]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Arduino CLI
      uses: arduino/setup-arduino-cli@v1
    
    - name: Install Arduino core
      run: |
        arduino-cli core update-index
        arduino-cli core install arduino:avr
    
    - name: Create build config
      run: |
        cd arduino/macro-keyboard-firmware
        echo "#define ${{ matrix.config }}" > build_config.h
        echo "#define ENCODER_COUNT ${{ matrix.encoder }}" >> build_config.h
        sed -i '1i #include "build_config.h"' config.h
    
    - name: Compile firmware
      run: |
        mkdir -p arduino/build
        arduino-cli compile --fqbn arduino:avr:micro arduino/macro-keyboard-firmware/macro-keyboard-firmware.ino --output-dir arduino/build
    
    - name: Upload firmware asset
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Upload firmware hex file
        FIRMWARE_FILE="./arduino/build/macro-keyboard-firmware.ino.hex"
        FIRMWARE_NAME="firmware-${{ matrix.config }}-enc${{ matrix.encoder }}.hex"
        
        if [ -f "$FIRMWARE_FILE" ]; then
          gh release upload "${{ github.ref_name }}" "$FIRMWARE_FILE#$FIRMWARE_NAME"
          echo "✅ Successfully uploaded firmware: $FIRMWARE_NAME"
        else
          echo "❌ Firmware file not found: $FIRMWARE_FILE"
          echo "Build directory contents:"
          ls -la ./arduino/build/ 2>/dev/null || echo "No build directory found"
          exit 1
        fi

  verify-release:
    name: Verify Release Assets
    needs: [build-and-upload, build-firmware]
    runs-on: ubuntu-latest
    
    steps:
    - name: Verify all assets are published
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "🔍 Checking release assets for ${{ github.ref_name }}..."
        
        # List all assets in the release
        gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name' > release_assets.txt
        
        echo "📦 Assets published in release:"
        cat release_assets.txt | sort
        
        # Count expected vs actual assets
        EXPECTED_DESKTOP=3  # Windows .exe, macOS .dmg, macOS .pkg, Linux .AppImage (but .dmg and .pkg could be optional)
        EXPECTED_FIRMWARE=20  # 5 configs × 4 encoder options
        
        ACTUAL_COUNT=$(wc -l < release_assets.txt)
        echo ""
        echo "📊 Release Summary:"
        echo "   Total assets published: $ACTUAL_COUNT"
        
        # Check for key asset types
        echo ""
        echo "🖥️  Desktop Applications:"
        grep -E "\.(exe|dmg|pkg|AppImage)$" release_assets.txt || echo "   No desktop applications found"
        
        echo ""
        echo "🔧 Arduino Firmware:"
        grep -E "firmware-.*\.hex$" release_assets.txt | wc -l | xargs echo "   Firmware variants:"
        
        echo ""
        echo "✅ Release verification complete! All OS-specific packages are now published and linked in the release."