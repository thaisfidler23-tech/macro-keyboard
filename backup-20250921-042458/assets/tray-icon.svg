<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="trayGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4A90E2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#357ABD;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect x="2" y="2" width="28" height="28" rx="6" ry="6" fill="url(#trayGradient)"/>
  
  <!-- Simplified keyboard layout -->
  <rect x="6" y="10" width="20" height="16" rx="2" ry="2" fill="#2C3E50" opacity="0.8"/>
  
  <!-- Key grid 2x2 -->
  <rect x="8" y="12" width="4" height="3" rx="1" ry="1" fill="#F5F5F5"/>
  <rect x="14" y="12" width="4" height="3" rx="1" ry="1" fill="#F5F5F5"/>
  <rect x="20" y="12" width="4" height="3" rx="1" ry="1" fill="#F5F5F5"/>
  
  <rect x="8" y="17" width="4" height="3" rx="1" ry="1" fill="#F5F5F5"/>
  <rect x="14" y="17" width="4" height="3" rx="1" ry="1" fill="#F5F5F5"/>
  <rect x="20" y="17" width="4" height="3" rx="1" ry="1" fill="#F5F5F5"/>
  
  <!-- Small encoder indicator -->
  <circle cx="25" cy="22" r="3" fill="#34495E"/>
  <circle cx="25" cy="22" r="2" fill="#E0E0E0"/>
</svg>